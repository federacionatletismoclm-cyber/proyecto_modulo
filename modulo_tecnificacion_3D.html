<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Módulo Tecnificación 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe0ee;font-family:Segoe UI,Arial,sans-serif}
  #c{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:12px;left:12px;background:#fffffff0;border-radius:10px;padding:10px 12px;box-shadow:0 2px 8px #0003;max-width:260px}
  #ui h1{font-size:14px;margin:0 0 2px;color:#12355b} #ui p{margin:0 0 8px;font-size:11px;color:#556}
  #ui button{display:block;width:100%;margin:4px 0;padding:6px 8px;border:1px solid #12355b;background:#fff;color:#12355b;border-radius:6px;cursor:pointer;font-size:12px;text-align:left}
  #ui button:hover{background:#12355b;color:#fff}
  #leg{position:fixed;bottom:12px;left:12px;background:#fffffff0;border-radius:10px;padding:8px 12px;font-size:11px;box-shadow:0 2px 8px #0003}
  #leg i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border:1px solid #0005}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Módulo de Tecnificación</h1>
  <p>Pabellón ≈ 92 × 43,4 m · 2 pistas + atletismo indoor</p>
  <button onclick="V('ext')">Vista exterior</button>
  <button onclick="V('atl')">Atletismo · desde salida</button>
  <button onclick="V('atl2')">Atletismo · vista aérea</button>
  <button onclick="V('cancha')">Pistas multideporte</button>
  <button onclick="V('int')">Vista interior</button>
  <button onclick="V('top')">Vista cenital</button>
  <button onclick="toggle('roof')">Mostrar / ocultar cubierta</button>
  <button onclick="save()">Guardar imagen PNG</button>
</div>
<div id="leg">
  <span><i style="background:#2c58a0"></i>Tartán atletismo</span>&nbsp;
  <span><i style="background:#3c8a5c"></i>Pistas PVC</span>&nbsp;
  <span><i style="background:#e0c27a"></i>Fosos</span>&nbsp;
  <span><i style="background:#9fb4c6"></i>Policarbonato</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
THREE.ColorManagement.legacyMode=false;
const TX=c=>{const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=16;return t};
const X=92,Z=43.4,EH=7,RH=12,LOW=1.2;
const cv=document.getElementById('c');

R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.8;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;

const cam=new THREE.PerspectiveCamera(42,1,.5,600);
const ctl=new THREE.OrbitControls(cam,cv);ctl.target.set(X/2,2,Z/2);ctl.maxPolarAngle=Math.PI/2.02;ctl.enableDamping=true;

sc.add(new THREE.HemisphereLight(0xffffff,0xb8c0c8,.45));
const sun=new THREE.DirectionalLight(0xfff4e5,1.8);sun.position.set(-40,90,-30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-80,right:80,top:60,bottom:-60,near:10,far:260});

(function(){const pm=new THREE.PMREMGenerator(R);const es=new THREE.Scene();
 const c=document.createElement('canvas');c.width=16;c.height=256;const q=c.getContext('2d');const gr=q.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#5f9be0');gr.addColorStop(.45,'#d8e6f3');gr.addColorStop(.5,'#c9d2cc');gr.addColorStop(1,'#6c726c');q.fillStyle=gr;q.fillRect(0,0,16,256);
 const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;
 es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:tx,side:THREE.BackSide})));
 const sp2=new THREE.Mesh(new THREE.BoxGeometry(16,1,16),new THREE.MeshBasicMaterial({color:0xffffff}));sp2.material.color.setScalar(9);sp2.position.set(-22,38,-16);sp2.lookAt(0,0,0);es.add(sp2);
 sc.environment=pm.fromScene(es,.03).texture})();

// ---- Terreno exterior
function procTex(size,base,fn,rep,srgb=true){const c=document.createElement('canvas');c.width=c.height=size;const q=c.getContext('2d');q.fillStyle=base;q.fillRect(0,0,size,size);fn&&fn(q,size);
 const id=q.getImageData(0,0,size,size),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*16;d[i]+=n;d[i+1]+=n;d[i+2]+=n}q.putImageData(id,0,0);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=16;if(srgb)t.encoding=THREE.sRGBEncoding;if(rep)t.repeat.set(rep,rep);return t}
const GR=procTex(512,'#6e9a55',(q,z)=>{for(let i=0;i<2500;i++){q.strokeStyle=Math.random()<.5?'rgba(150,190,100,.5)':'rgba(40,80,35,.5)';q.beginPath();const x=Math.random()*z,y=Math.random()*z;q.moveTo(x,y);q.lineTo(x+Math.random()*4-2,y-Math.random()*8);q.stroke()}},1/6);
const SL=procTex(512,'#c4c6c0',(q,z)=>{for(let i=0;i<60;i++){q.fillStyle='rgba(120,120,115,.07)';q.beginPath();q.arc(Math.random()*z,Math.random()*z,20+Math.random()*60,0,7);q.fill()}
 q.strokeStyle='#868a84';q.lineWidth=5;q.strokeRect(0,0,z,z)},1/4);
const CT=procTex(512,'#b3b0a7',(q,z)=>{for(let i=0;i<90;i++){q.fillStyle=Math.random()<.5?'rgba(255,255,255,.06)':'rgba(70,65,55,.07)';q.beginPath();q.arc(Math.random()*z,Math.random()*z,15+Math.random()*70,0,7);q.fill()}
 for(let i=0;i<220;i++){q.fillStyle='rgba(60,55,50,.45)';q.beginPath();q.arc(Math.random()*z,Math.random()*z,1+Math.random()*1.5,0,7);q.fill()}
 q.strokeStyle='rgba(70,66,60,.55)';q.lineWidth=2;q.beginPath();q.moveTo(0,1);q.lineTo(z,1);q.moveTo(1,0);q.lineTo(1,z);q.stroke();
 [[.25,.3],[.75,.3],[.25,.8],[.75,.8]].forEach(([a,b])=>{q.fillStyle='rgba(50,48,44,.7)';q.beginPath();q.arc(a*z,b*z,5,0,7);q.fill()});
 const g2=q.createLinearGradient(0,z*.75,0,z);g2.addColorStop(0,'rgba(60,55,45,0)');g2.addColorStop(1,'rgba(60,55,45,.22)');q.fillStyle=g2;q.fillRect(0,z*.75,z,z*.25)});
function concMat(w,h){const t=CT.clone();t.needsUpdate=true;t.repeat.set(w/2,h/1.2);return new THREE.MeshStandardMaterial({map:t,roughness:.93})}
const PIT=[19.1,14.2,27.8,18.2];
function holeGeo(x0,z0,x1,z1){const v=(x,z)=>new THREE.Vector2(x,-z);
  const sh=new THREE.Shape([v(x0,z0),v(x1,z0),v(x1,z1),v(x0,z1)]);
  sh.holes.push(new THREE.Path([v(PIT[0],PIT[1]),v(PIT[0],PIT[3]),v(PIT[2],PIT[3]),v(PIT[2],PIT[1])]));
  const g=new THREE.ShapeGeometry(sh);g.rotateX(-Math.PI/2);return g}
function holePlane(x0,z0,x1,z1,y,mat){const m=new THREE.Mesh(holeGeo(x0,z0,x1,z1),mat);m.position.y=y;m.receiveShadow=true;sc.add(m);return m}
holePlane(X/2-200,Z/2-150,X/2+200,Z/2+150,-.05,new THREE.MeshStandardMaterial({map:GR,roughness:1,side:THREE.DoubleSide}));
holePlane(-7,-7,X+7,Z+7,-.02,new THREE.MeshStandardMaterial({map:SL,roughness:.95,side:THREE.DoubleSide}));
// campo de fútbol existente (norte)
const ff=document.createElement('canvas');ff.width=1100;ff.height=620;const fx=ff.getContext('2d');
fx.fillStyle='#4f9a5a';fx.fillRect(0,0,1100,620);fx.strokeStyle='#fff';fx.lineWidth=5;fx.strokeRect(30,30,1040,560);
fx.beginPath();fx.moveTo(550,30);fx.lineTo(550,590);fx.stroke();fx.beginPath();fx.arc(550,310,80,0,7);fx.stroke();
fx.strokeRect(30,170,160,280);fx.strokeRect(910,170,160,280);
const fld=new THREE.Mesh(new THREE.PlaneGeometry(100,56),new THREE.MeshStandardMaterial({map:TX(ff)}));
fld.rotation.x=-Math.PI/2;fld.position.set(X/2,-.01,-42);fld.receiveShadow=true;sc.add(fld);

// ---- Suelo interior con marcas (canvas 20 px/m)
const k=32,fc=document.createElement('canvas');fc.width=X*k;fc.height=Z*k;const g=fc.getContext('2d');
g.fillStyle='#808a90';g.fillRect(0,0,fc.width,fc.height);
const rect=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x*k,y*k,w*k,h*k)};
const line=(x1,y1,x2,y2,w=.1,c='#fff')=>{g.strokeStyle=c;g.lineWidth=w*k;g.beginPath();g.moveTo(x1*k,y1*k);g.lineTo(x2*k,y2*k);g.stroke()};
const arc=(cx,cy,r,a0,a1,w=.1)=>{g.strokeStyle='#fff';g.lineWidth=w*k;g.beginPath();g.arc(cx*k,cy*k,r*k,a0,a1);g.stroke()};
const BLUE='#2c58a0';
// atletismo
rect(1,1.9,90,9.76,BLUE);
for(let i=0;i<=8;i++)line(31,1.9+i*9.76/8,91,1.9+i*9.76/8,.07);
line(31,1.9,31,11.66,.2);line(91,1.9,91,11.66,.2);
for(let i=0;i<8;i++){g.fillStyle='#fff';g.font=`${.8*k}px Arial`;g.fillText(i+1,32*k,(1.9+i*9.76/8+1)*k)}
// saltos
rect(27.8,15,50.4,1.1,BLUE);rect(27.8,16.4,50.4,1.1,BLUE);
rect(28.7,15,.25,1.1,'#fff');rect(28.7,16.4,.25,1.1,'#fff');rect(36,16.4,.25,1.1,'#fff');
rect(77.3,12.7,7.7,5.9,'#22304f');
rect(7.8,14.7,5.8,3.9,BLUE);arc(10.7,18.6,2.4,Math.PI,0,.08);rect(9.2,15.3,3,2,'#c8553d');
// pistas
function court(x,y){const w=38.7,h=19.2;rect(x,y,w,h,'#3c8a5c');
  g.strokeStyle='#fff';g.lineWidth=.12*k;g.strokeRect(x*k,y*k,w*k,h*k);line(x+w/2,y,x+w/2,y+h,.12);arc(x+w/2,y+h/2,3,0,7,.12);
  [[0,1],[w,-1]].forEach(([px,d])=>{const yc=h/2;g.strokeStyle='#fff';g.lineWidth=.12*k;g.beginPath();
    g.arc((x+px)*k,(y+yc-1.5)*k,6*k,d>0?-Math.PI/2:Math.PI*1.5,d>0?0:Math.PI,d<0);g.stroke();
    g.beginPath();g.arc((x+px)*k,(y+yc+1.5)*k,6*k,d>0?0:Math.PI,d>0?Math.PI/2:Math.PI/2,d<0);g.stroke();
    line(x+px+6*d,y+yc-1.5,x+px+6*d,y+yc+1.5,.12);
  })}
court(2,21.5);court(51.3,21.5);
(function(){const id=g.getImageData(0,0,fc.width,fc.height),d=id.data;
 for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*26;d[i]+=n;d[i+1]+=n;d[i+2]+=n;
   if(d[i+2]>120&&d[i]<90&&Math.random()<.035){d[i]=170;d[i+1]=60;d[i+2]=50}}
 g.putImageData(id,0,0)})();
const ftex=TX(fc);ftex.anisotropy=8;
const fgeo=holeGeo(0,0,X,Z);{const pa=fgeo.attributes.position,uv=new Float32Array(pa.count*2);
  for(let i=0;i<pa.count;i++){uv[i*2]=pa.getX(i)/X;uv[i*2+1]=1-pa.getZ(i)/Z}
  fgeo.setAttribute('uv',new THREE.BufferAttribute(uv,2))}
const fl=new THREE.Mesh(fgeo,new THREE.MeshStandardMaterial({map:ftex,roughness:.6,metalness:.02,side:THREE.DoubleSide}));
fl.position.y=.02;fl.receiveShadow=true;sc.add(fl);

// ---- Elementos deportivos
const WH=M(0xffffff),MAT=M(0x1e2a44),SAND=M(0xe0c27a);
function goal(x,z,dir){const g3=new THREE.Group();const fr=M(0xf2f2f2);
  [[0,1],[0,-1]].forEach(([_,s])=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,2),fr);p.position.set(0,1,s*1.5);g3.add(p)});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,3),fr);b.rotation.x=Math.PI/2;b.position.set(0,2,0);g3.add(b);
  const net=new THREE.Mesh(new THREE.BoxGeometry(1,2,3),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35}));net.position.set(dir*.5,1,0);g3.add(net);
  g3.position.set(x,0,z);g3.traverse(o=>o.castShadow=true);sc.add(g3)}
[[2,2],[51.3,2]].forEach(([x0])=>{goal(x0,21.5+9.6,-1);goal(x0+38.7,21.5+9.6,1)});
(function(){const w=PIT[2]-PIT[0],d=PIT[3]-PIT[1],cx=(PIT[0]+PIT[2])/2,cz=(PIT[1]+PIT[3])/2;
 const sc2=document.createElement('canvas');sc2.width=512;sc2.height=240;const q=sc2.getContext('2d');
 q.fillStyle='#d9bd82';q.fillRect(0,0,512,240);
 for(let i=0;i<9000;i++){const t=Math.random();q.fillStyle=t<.5?'rgba(255,240,200,.35)':'rgba(150,110,60,.35)';q.fillRect(Math.random()*512,Math.random()*240,2,2)}
 q.strokeStyle='rgba(140,100,55,.25)';q.lineWidth=2;for(let y=6;y<240;y+=9){q.beginPath();q.moveTo(0,y);q.lineTo(512,y+(Math.random()-.5)*4);q.stroke()}
 q.fillStyle='rgba(110,75,40,.45)';[[70,110],[96,102],[84,134],[128,120]].forEach(([a,b])=>{q.beginPath();q.ellipse(a,b,10,5,.2,0,7);q.fill()});
 const sand=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({map:TX(sc2),roughness:1}));
 sand.rotation.x=-Math.PI/2;sand.position.set(cx,-.02,cz);sand.receiveShadow=true;sc.add(sand);
 box(w,.7,d,PM(0x6e5a3a),cx,-.4,cz,false);
 [[w,.2,cx,PIT[1]-.1],[w,.2,cx,PIT[3]+.1]].forEach(([a,b,x,z])=>box(a+.4,.07,b,PM(0x1c3d73),x,.045,z,false));
 [[.2,d,PIT[0]-.1,cz],[.2,d,PIT[2]+.1,cz]].forEach(([a,b,x,z])=>box(a,.07,b,PM(0x1c3d73),x,.045,z,false));
})();
box(7.7,.6,5.9,MAT,81.15,.3,15.65);                        // colchoneta pértiga
box(3.5,.6,3,M(0x1e2a44),10.7,.3,17);                      // colchoneta altura
// pórticos de salto de altura
box(.08,2.5,.08,WH,9.2,1.25,15.3);box(.08,2.5,.08,WH,12.2,1.25,15.3);

// ---- Estructura metálica (perfiles IPE/HEB, placas y tornillería)
const STEEL=new THREE.MeshStandardMaterial({color:0x56626e,roughness:.4,metalness:.8});
const GALV=new THREE.MeshStandardMaterial({color:0xb4bbc1,roughness:.32,metalness:.92});
function iShape(bf,h,tf,tw){const a=bf/2,b=h/2,w=tw/2,s2=new THREE.Shape();
 s2.moveTo(-a,-b);s2.lineTo(a,-b);s2.lineTo(a,-b+tf);s2.lineTo(w,-b+tf);s2.lineTo(w,b-tf);s2.lineTo(a,b-tf);s2.lineTo(a,b);s2.lineTo(-a,b);s2.lineTo(-a,b-tf);s2.lineTo(-w,b-tf);s2.lineTo(-w,-b+tf);s2.lineTo(-a,-b+tf);s2.lineTo(-a,-b);return s2}
function iBeam(bf,h,tf,tw,l,mat){const g=new THREE.ExtrudeGeometry(iShape(bf,h,tf,tw),{depth:l,bevelEnabled:false});g.translate(0,0,-l/2);
 const m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m}
const nF=13,sp=X/(nF-1),len=Math.hypot(Z/2,RH-EH),ang=Math.atan2(RH-EH,Z/2);
const bolts=new THREE.InstancedMesh(new THREE.CylinderGeometry(.022,.022,.05,8),GALV,3000);let bi=0;const dm=new THREE.Object3D();
function bolt(x,y,z,ax){dm.position.set(x,y,z);dm.rotation.set(0,0,ax=='x'?Math.PI/2:0);dm.updateMatrix();bolts.setMatrixAt(bi++,dm.matrix)}
function rod(p,q2,r2,mat){const d=new THREE.Vector3().subVectors(q2,p),l=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r2,r2,l,8),mat);
 m.position.copy(p).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=true;sc.add(m)}
for(let i=0;i<nF;i++){const x=i*sp;
  [0,Z].forEach(z=>{const dir=z?-1:1;
    const c=iBeam(.3,.3,.019,.011,EH,STEEL);c.rotation.x=-Math.PI/2;c.position.set(x,EH/2,z);sc.add(c);
    box(.55,.035,.55,STEEL,x,.018,z);
    [[-.22,-.22],[.22,-.22],[-.22,.22],[.22,.22]].forEach(([dx,dz])=>bolt(x+dx,.06,z+dz,'y'));
    box(.034,.75,.55,STEEL,x,EH-.2,z+dir*.2);                                   // cartela de nudo
    [[-.15,.2],[.15,.2],[-.15,-.1],[.15,-.1]].forEach(([dz,dy])=>{bolt(x-.02,EH-.2+dy*.9,z+dir*(.2+dz),'x');bolt(x+.02,EH-.2+dy*.9,z+dir*(.2+dz),'x')});
  });
  [0,1].forEach(j=>{const b2=iBeam(.19,.45,.02,.011,len,STEEL);b2.rotation.x=j?ang:-ang;b2.position.set(x,(EH+RH)/2,j?Z*3/4:Z/4);sc.add(b2)});
  box(.034,.8,.5,STEEL,x,RH-.25,Z/2);                                          // placa de cumbrera
  [[-.12,.15],[.12,.15],[-.12,-.1],[.12,-.1]].forEach(([dz,dy])=>{bolt(x-.02,RH-.25+dy,Z/2+dz,'x');bolt(x+.02,RH-.25+dy,Z/2+dz,'x')});
}
bolts.count=bi;bolts.castShadow=true;sc.add(bolts);
// correas (perfil Z galvanizado) y vigas de atado
for(let j=1;j<10;j++){const t=j/10;[0,1].forEach(sd=>{const z=sd?Z-t*Z/2:t*Z/2,y=EH+(RH-EH)*t;const p=box(X,.17,.06,GALV,X/2,y+.33,z);p.rotation.x=sd?ang:-ang})}
box(X,.22,.12,STEEL,X/2,EH-.3,.12);box(X,.22,.12,STEEL,X/2,EH-.3,Z-.12);
// arriostramientos en cruz (vanos extremos)
[0,nF-2].forEach(bay=>[.3,Z-.3].forEach(zz=>{const x0=bay*sp+.35,x1=(bay+1)*sp-.35;
  rod(new THREE.Vector3(x0,.3,zz),new THREE.Vector3(x1,EH-.5,zz),.02,GALV);rod(new THREE.Vector3(x0,EH-.5,zz),new THREE.Vector3(x1,.3,zz),.02,GALV)}));

// ---- Cubierta (panel sándwich 10 cm, nervado)
const roof=new THREE.Group();
const ribC=document.createElement('canvas');ribC.width=64;ribC.height=8;{const q=ribC.getContext('2d');const gr=q.createLinearGradient(0,0,64,0);
 [[0,'#444'],[.12,'#444'],[.26,'#fff'],[.62,'#fff'],[.76,'#444'],[1,'#444']].forEach(([o,c])=>gr.addColorStop(o,c));q.fillStyle=gr;q.fillRect(0,0,64,8)}
const ribT=new THREE.CanvasTexture(ribC);ribT.wrapS=ribT.wrapT=THREE.RepeatWrapping;ribT.repeat.set((X+1)/.333,1);ribT.anisotropy=16;
const RM=new THREE.MeshStandardMaterial({color:0xe6eaed,roughness:.48,metalness:.3,bumpMap:ribT,bumpScale:2.2,side:THREE.DoubleSide});
[0,1].forEach(sd=>{const p=new THREE.Mesh(new THREE.BoxGeometry(X+1,.1,len+.8),RM);
  p.position.set(X/2,(EH+RH)/2+.55,sd?Z*3/4:Z/4);p.rotation.x=sd?ang:-ang;p.receiveShadow=true;roof.add(p)});
sc.add(roof);
